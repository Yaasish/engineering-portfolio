name: Verify portfolio

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Compile sanitized hydrogel model manifest
        run: |
          mkdir -p "$RUNNER_TEMP/hydrogel-model"
          javac -d "$RUNNER_TEMP/hydrogel-model" projects/01-hydrogel-multiphysics/code/HydrogelModelDefinition.java
          java -cp "$RUNNER_TEMP/hydrogel-model" portfolio.hydrogel.HydrogelModelDefinition
      - name: Run strain-analysis tests
        run: python -m unittest discover -s projects/03-ultrasonic-strain/tests -v
      - name: Check links, privacy, and excluded artefacts
        run: python scripts/check_portfolio.py
